<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stimuler · Recording Stage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050509}
  /* premium dark + gold matchday backdrop */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 42%, #16131f 0%, #0b0912 44%, #060509 78%, #040407 100%)}
  /* breathing gold glow behind the phone */
  .glow{position:absolute;top:50%;left:50%;width:720px;height:720px;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(251,191,36,.24), rgba(245,158,11,.08) 46%, transparent 70%);
    filter:blur(6px);pointer-events:none;animation:breathe 6.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  /* soft floating bokeh — subtle, blurred, slow */
  .bokeh{position:absolute;border-radius:50%;filter:blur(26px);pointer-events:none;opacity:.5}
  .b1{width:190px;height:190px;left:13%;top:20%;background:rgba(251,191,36,.28);animation:drift1 15s ease-in-out infinite}
  .b2{width:130px;height:130px;right:14%;top:28%;background:rgba(253,224,71,.22);animation:drift2 18s ease-in-out infinite}
  .b3{width:230px;height:230px;left:18%;bottom:12%;background:rgba(245,158,11,.16);animation:drift3 21s ease-in-out infinite}
  .b4{width:150px;height:150px;right:15%;bottom:16%;background:rgba(255,255,255,.05);animation:drift1 24s ease-in-out infinite}
  .b5{width:90px;height:90px;left:46%;top:11%;background:rgba(251,191,36,.18);animation:drift2 19s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-34px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-32px,26px)}}
  @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,30px)}}
  /* vignette keeps the phone the hero */
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 47%, transparent 40%, rgba(0,0,0,.42) 80%, rgba(0,0,0,.68) 100%)}

  /* floating device — the frame; the iframe runs the app in its natural full-screen phone mode */
  .device{position:relative;z-index:2;width:390px;height:844px;border-radius:52px;overflow:hidden;
    box-shadow:0 0 0 2px #17171c, 0 0 0 12px #0a0a0e, 0 0 0 13px #2b2b32,
               0 44px 90px -22px rgba(0,0,0,.62), 0 0 70px rgba(251,191,36,.16);
    animation:float 7s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(-9px) rotate(-.5deg)}50%{transform:translateY(9px) rotate(.5deg)}}
  .device iframe{width:390px;height:844px;border:0;display:block;background:#0b0a10}
  /* soft ground shadow */
  .ground{position:absolute;z-index:1;bottom:7%;left:50%;width:330px;height:44px;transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.6), transparent 70%);filter:blur(8px);
    animation:groundPulse 7s ease-in-out infinite}
  @keyframes groundPulse{0%,100%{opacity:.5;transform:translateX(-50%) scale(.92)}50%{opacity:.72;transform:translateX(-50%) scale(1.04)}}

  /* scale the whole scene to fit shorter screens (keeps the frame + shadows proportional) */
  .fit{transform-origin:center;transform:scale(1)}
  @media (max-height:960px){ .fit{transform:scale(.9)} }
  @media (max-height:880px){ .fit{transform:scale(.82)} }
  @media (max-height:780px){ .fit{transform:scale(.72)} }
  @media (max-height:700px){ .fit{transform:scale(.64)} }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="bokeh b1"></div><div class="bokeh b2"></div><div class="bokeh b3"></div>
    <div class="bokeh b4"></div><div class="bokeh b5"></div>
    <div class="fit">
      <div class="ground"></div>
      <div class="device">
        <iframe src="index.html" title="Stimuler prototype" scrolling="no"></iframe>
      </div>
    </div>
    <div class="vignette"></div>
  </div>
</body>
</html>
